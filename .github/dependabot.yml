version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    day: monday
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    npm-minor-patch:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: "*"
    update-types:
    - "version-update:semver-major"
  commit-message:
    prefix: chore(deps)
